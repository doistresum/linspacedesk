<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Monitor -->
  <rect x="80" y="100" width="280" height="200" rx="16" fill="url(#screen)" stroke="#38bdf8" stroke-width="4"/>
  <!-- Monitor stand -->
  <rect x="190" y="300" width="60" height="30" fill="#334155"/>
  <rect x="160" y="325" width="120" height="12" rx="6" fill="#475569"/>
  <!-- Screen content - grid -->
  <line x1="100" y1="140" x2="340" y2="140" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="180" x2="340" y2="180" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="220" x2="340" y2="220" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="260" x2="340" y2="260" stroke="#1e40af" stroke-width="1" opacity="0.3"/>
  <!-- Tablet -->
  <rect x="300" y="160" width="140" height="200" rx="12" fill="url(#screen)" stroke="#2dd4bf" stroke-width="4"/>
  <!-- Tablet screen glow -->
  <rect x="312" y="178" width="116" height="164" rx="4" fill="#0f172a"/>
  <!-- Connection waves -->
  <path d="M 260 200 Q 280 190 300 200" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  <path d="M 255 215 Q 280 200 305 215" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
  <path d="M 250 230 Q 280 210 310 230" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>
  <!-- Link symbol -->
  <circle cx="280" cy="380" r="30" fill="none" stroke="#2dd4bf" stroke-width="4"/>
  <path d="M 268 380 L 278 390 L 295 370" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Linux penguin hint -->
  <circle cx="140" cy="400" r="20" fill="#fbbf24" opacity="0.8"/>
  <circle cx="134" cy="395" r="3" fill="#0f172a"/>
  <circle cx="146" cy="395" r="3" fill="#0f172a"/>
  <path d="M 132 405 Q 140 412 148 405" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
</svg>
